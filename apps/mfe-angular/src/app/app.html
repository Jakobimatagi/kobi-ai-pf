<div class="min-h-full w-full bg-slate-50">
  <header class="border-b border-slate-200 bg-white">
    <div class="mx-auto flex max-w-2xl flex-wrap items-center gap-2 px-4 py-3">
      <span
        class="mr-1 rounded-full bg-rose-100 px-2.5 py-0.5 text-xs font-semibold text-rose-700"
      >
        Angular MFE
      </span>
      <nav class="flex flex-wrap items-center gap-1">
        <a
          routerLink="/"
          routerLinkActive="!bg-slate-900 !text-white"
          [routerLinkActiveOptions]="{ exact: true }"
          class="rounded-lg px-3 py-1.5 text-sm font-medium text-slate-600 transition hover:bg-slate-100 hover:text-slate-900"
        >
          Home
        </a>
        @for (c of components; track c.path) {
          <a
            [routerLink]="c.path"
            routerLinkActive="!bg-slate-900 !text-white"
            class="rounded-lg px-3 py-1.5 text-sm font-medium text-slate-600 transition hover:bg-slate-100 hover:text-slate-900"
          >
            {{ c.label }}
          </a>
        }
      </nav>
    </div>
  </header>
  <main class="py-2">
    <router-outlet></router-outlet>
  </main>
</div>
